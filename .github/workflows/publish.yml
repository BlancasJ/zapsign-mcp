name: publish

# A release published on GitHub stages its version on npm through npm's trusted publishing (no
# token). The version goes live only when the maintainer approves it on npmjs.com with 2FA; then
# it is listed in the MCP Registry.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: The release tag is the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$want" ] || { echo "the release tag is $TAG, package.json says $want"; exit 1; }
      - name: npm can stage (11.15.0 or newer)
        run: |
          v="$(npm --version)"
          printf '%s\n' 11.15.0 "$v" | sort -V -C || { echo "npm $v cannot stage a publish"; exit 1; }
      - run: npm test
      - run: npm stage publish
      - run: echo "::notice::Staged on npm. Approve it at https://www.npmjs.com/package/zapsign-mcp with 2FA to put it live."

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Wait until the version is live on npm (approve it on npmjs.com)
        run: |
          version="$(jq -r .version package.json)"
          for minute in $(seq 1 60); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/zapsign-mcp/$version" && exit 0
            sleep 60
          done
          echo "zapsign-mcp@$version is not live after an hour: approve it on npmjs.com, then re-run this job"
          exit 1
      - name: Get mcp-publisher 1.8.1, checked against its digest
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry (npm can take a moment to show a new version)
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
